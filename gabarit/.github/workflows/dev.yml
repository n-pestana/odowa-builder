name: Site de test

# Chaque envoi sur "dev" : publication sur le site de test + contrôles.
# Les deux tâches sont séparées : le site de test se met à jour même si un contrôle est rouge.

on:
  push:
    branches: [dev]

concurrency:
  group: site-de-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apercu:
    name: apercu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Construire le site (mode test, non indexable)
        env:
          PUBLIC_ENV: dev
          PUBLIC_VERSION: ${{ github.sha }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
        run: npm run build
      - name: Vérifier que le site de test n'est pas indexable
        run: npm run check -- --mode=dev
      - name: Publier sur le site de test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name="${{ vars.CLOUDFLARE_PROJET }}" --branch=dev --commit-hash="${{ github.sha }}" --commit-dirty=true

  controles:
    name: controles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/controles
